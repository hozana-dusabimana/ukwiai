services:
  database:
    image: mysql:8.0
    container_name: ukwi_database
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_change_me}
      MYSQL_DATABASE: ${DB_NAME:-ukwi_db}
      MYSQL_USER: ${DB_USER:-ukwi_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change_me_strong_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_change_me}"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [ukwi_net]

  ai_service:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    container_name: ukwi_ai_service
    restart: unless-stopped
    environment:
      AI_MODEL_PATH: ${AI_MODEL_PATH:-/app/models/basketball_court_cnn.h5}
      AI_MODEL_VERSION: ${AI_MODEL_VERSION:-1.0.0}
      AI_INPUT_SIZE: ${AI_INPUT_SIZE:-224}
      AI_FORCE_HEURISTIC: ${AI_FORCE_HEURISTIC:-0}
    ports:
      - "8001:8001"
    volumes:
      - ./ai_service/models:/app/models
      - ./ai_service/data:/app/data
      - upload_data:/app/storage/uploads:ro
    networks: [ukwi_net]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 15s
      timeout: 10s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ukwi_backend
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
      ai_service:
        condition: service_started
    environment:
      DB_HOST: database
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-ukwi_db}
      DB_USER: ${DB_USER:-ukwi_user}
      DB_PASSWORD: ${DB_PASSWORD:-change_me_strong_password}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change_me_to_a_long_random_string_at_least_64_chars_in_production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      AI_SERVICE_URL: http://ai_service:8001
      AI_SERVICE_TIMEOUT: ${AI_SERVICE_TIMEOUT:-120}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost}
      UPLOAD_DIR: /app/storage/uploads
      REPORTS_DIR: /app/storage/reports
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-20}
      BUDGET_OVERRUN_PERCENT: ${BUDGET_OVERRUN_PERCENT:-5.0}
      DELAY_ALERT_DAYS: ${DELAY_ALERT_DAYS:-7}
    ports:
      - "8000:8000"
    volumes:
      - upload_data:/app/storage/uploads
      - report_data:/app/storage/reports
    networks: [ukwi_net]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ukwi_frontend
    restart: unless-stopped
    depends_on: [backend]
    environment:
      NODE_ENV: production
      PORT: 3000
      BACKEND_URL: http://backend:8000
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-http://localhost:8000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@ukwi.rw}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe!2026}
    ports:
      - "80:3000"
    networks: [ukwi_net]

volumes:
  mysql_data:
  upload_data:
  report_data:

networks:
  ukwi_net:
    driver: bridge
