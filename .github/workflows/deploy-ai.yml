name: Deploy AI Service

on:
  push:
    branches: [main]
    paths:
      - "ai_service/**"
      - "docker-compose.prod.yml"
      - ".github/workflows/deploy-ai.yml"
  workflow_dispatch:

concurrency:
  # Shared across all deploy-* workflows so they serialize: only one
  # `docker compose up --build` touches the host at a time. Independent groups
  # let concurrent deploys race on container recreate ("removal already in
  # progress") and contend for resources.
  group: deploy-host
  cancel-in-progress: false

env:
  EC2_HOST: 13.63.117.119
  EC2_USER: ubuntu
  PROJECT_DIR: ~/ukwiai
  HEALTH_URL: https://ai-ukwiai.isiri.rw/health

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Sync repo and rebuild ai_service on the server
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            "$EC2_USER@$EC2_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd ~/ukwiai
          git fetch --prune --force origin main || { git remote prune origin || true; git fetch --force origin main; }
          git reset --hard FETCH_HEAD
          git --no-pager log --oneline -1

          # OWLv2 is ON by default (compose defaults + .env.prod) so the
          # non-court relevance gate is reliably active. OWLv2 (torch + ~600 MB
          # model) needs the AI container at ~2 GB; this box is network_mode:host
          # and shared with MySQL/backend/frontend. Safety valve: if the host is
          # genuinely low on RAM at deploy time, DOWNGRADE to heuristic-only so we
          # don't OOM prod. On the 30 GB d2.xlarge this branch never fires.
          # Exported shell vars override the compose/.env.prod defaults.
          AVAIL_MB=$(free -m | awk '/^Mem:/ {print $7}')
          echo "Available memory: ${AVAIL_MB:-unknown} MB"
          if [ "${AVAIL_MB:-0}" -ge 2200 ]; then
            echo "Sufficient RAM -> keeping OWLv2 enabled (torch + transformers)."
          else
            echo "Insufficient RAM (need >=2200 MB available) -> downgrading to heuristic-only."
            export AI_REQUIREMENTS=requirements.prod.txt
            export AI_MEM_LIMIT=900m
            export AI_DISABLE_OBJDET=1
          fi

          docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build ai_service
          docker image prune -f
          REMOTE

      - name: Health-check the public AI domain
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$HEALTH_URL" || echo 000)
            echo "attempt $i: $HEALTH_URL -> $code"
            [ "$code" = "200" ] && exit 0
            sleep 6
          done
          echo "AI service health check failed"; exit 1
