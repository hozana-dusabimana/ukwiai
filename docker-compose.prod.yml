# Production compose for the shared CloudPanel box (ARM64, ~1.8 GB RAM).
#
# Architecture notes (why this differs from docker-compose.yml):
#  * NO database/redis containers — we reuse the host's Percona MySQL on
#    127.0.0.1:3306. DB-dependent services therefore use `network_mode: host`
#    and connect to 127.0.0.1 (the docker bridge gateway 172.17.0.1:3306 is
#    firewall-refused on this box).
#  * The frontend is NOT static nginx — it's an Express server that serves the
#    built SPA *and* proxies /api/* to the backend server-side. So it also runs
#    on host networking and reaches the backend over loopback. Every service
#    binds 127.0.0.1 ONLY; public ingress is handled by CloudPanel's nginx
#    (reverse-proxy sites + Let's Encrypt). Nothing here binds 0.0.0.0.
#  * mem_limit caps protect the OTHER tenants (aira/sinarms/verifyai) from a
#    runaway: an over-limit container is OOM-killed and restarted in isolation.
#  * All config comes from .env.prod (mode 600, gitignored, lives on the host).

services:
  ai_service:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    image: ukwi_ai_service:prod
    container_name: ukwi_ai_service
    restart: unless-stopped
    network_mode: host
    environment:
      AI_MODEL_PATH: ${AI_MODEL_PATH:-/app/models/basketball_court_cnn.h5}
      AI_MODEL_VERSION: ${AI_MODEL_VERSION:-1.0.0}
      AI_INPUT_SIZE: ${AI_INPUT_SIZE:-224}
      # Heuristic-only on this RAM-constrained box: skip the trained CNN (TF)
      # and the OWLv2 detector (torch, ~600 MB). Flip both off on a bigger box.
      AI_FORCE_HEURISTIC: ${AI_FORCE_HEURISTIC:-1}
      AI_DISABLE_OBJDET: ${AI_DISABLE_OBJDET:-1}
    command: >
      uvicorn app.main:app --host 127.0.0.1 --port ${AI_PORT:-8004}
    volumes:
      - ./ai_service/models:/app/models
      - ukwi_uploads:/app/storage/uploads:ro
    mem_limit: 900m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:${AI_PORT:-8004}/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ukwi_backend:prod
    container_name: ukwi_backend
    restart: unless-stopped
    network_mode: host
    depends_on:
      - ai_service
    environment:
      ENVIRONMENT: production
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-ukwi_db}
      DB_USER: ${DB_USER:-ukwi_user}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      AI_SERVICE_URL: http://127.0.0.1:${AI_PORT:-8004}
      AI_SERVICE_TIMEOUT: ${AI_SERVICE_TIMEOUT:-120}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://ukwiai.isiri.rw}
      UPLOAD_DIR: /app/storage/uploads
      REPORTS_DIR: /app/storage/reports
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-20}
      BUDGET_OVERRUN_PERCENT: ${BUDGET_OVERRUN_PERCENT:-5.0}
      DELAY_ALERT_DAYS: ${DELAY_ALERT_DAYS:-7}
    command: >
      gunicorn app.main:app
      --workers 1
      --worker-class uvicorn.workers.UvicornWorker
      --bind 127.0.0.1:${BACKEND_PORT:-8003}
      --timeout 180
      --access-logfile - --error-logfile -
    volumes:
      - ukwi_uploads:/app/storage/uploads
      - ukwi_reports:/app/storage/reports
    mem_limit: 600m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:${BACKEND_PORT:-8003}/api/system/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ukwi_frontend:prod
    container_name: ukwi_frontend
    restart: unless-stopped
    network_mode: host
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      HOST: 127.0.0.1
      PORT: ${FRONTEND_PORT:-5181}
      # Server-side proxy target (loopback to the backend on this host).
      BACKEND_URL: http://127.0.0.1:${BACKEND_PORT:-8003}
      # Public origin used to build absolute image URLs handed to the browser.
      # Pointing at the app's own origin keeps images same-origin (routed back
      # through this Express proxy), so no cross-origin/CORS hop is needed.
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-https://ukwiai.isiri.rw}
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${FRONTEND_PORT:-5181}/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  ukwi_uploads:
  ukwi_reports:
